name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci

      - name: Verify toolchain and lifecycle allowlist
        run: npm run verify:toolchain && npm run audit:install-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Prepare Electron and native modules
        run: npm run bootstrap:native

      - name: Static checks and unit tests
        run: npm run check

      - name: Real PTY integration test
        run: npm run test:run
        env:
          LGT_NATIVE_TESTS: '1'

      - name: Build hardened distributable artifacts
        run: npm run make

      - name: Verify packaged native assets
        run: npm run verify:native-assets

      - name: Verify final Electron Fuses
        run: npm run verify:fuses

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-windows-x64
          path: out/**/*
          if-no-files-found: error
          retention-days: 7
