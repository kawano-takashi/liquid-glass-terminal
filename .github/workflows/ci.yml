name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows x64 native
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci

      - name: Verify toolchain and lifecycle allowlist
        run: npm run verify:toolchain && npm run audit:install-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Restore and build native dependencies
        run: npm run bootstrap:native

      - name: Static checks and unit tests
        run: npm run check

      - name: Real ConPTY integration test
        run: npm run test:run
        env:
          LGT_NATIVE_TESTS: '1'

      - name: Build normal package and MSI
        run: npm run make

      - name: Verify package and installer
        run: npm run verify:native-assets && npm run verify:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-windows-x64
          path: build/artifacts/*.msi
          if-no-files-found: error
          retention-days: 7
