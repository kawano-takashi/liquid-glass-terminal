name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: package-windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            artifact: package-linux-x64
          - name: macOS arm64
            os: macos-26
            artifact: package-macos-arm64
          - name: macOS x64
            os: macos-26-intel
            artifact: package-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies without lifecycle scripts
        run: npm ci

      - name: Verify toolchain and lifecycle allowlist
        run: npm run verify:toolchain && npm run audit:install-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Prepare Electron and native modules
        run: npm run bootstrap:native

      - name: Static checks and unit tests
        run: npm run check

      - name: Real PTY integration test
        run: npm run test:run
        env:
          LGT_NATIVE_TESTS: '1'

      - name: Build E2E-instrumented package
        run: npm run package:e2e

      - name: Electron launch smoke
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Electron launch smoke on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Build hardened distributable artifacts
        run: npm run make

      - name: Verify packaged native assets
        run: npm run verify:native-assets

      - name: Verify final Electron Fuses
        run: npm run verify:fuses

      - name: Final package process smoke
        if: runner.os != 'Linux'
        run: npm run smoke:package

      - name: Final package process smoke on Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:package

      - name: Upload package smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: out/**/*
          if-no-files-found: error
          retention-days: 7
