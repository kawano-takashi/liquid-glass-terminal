name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install and verify dependencies
        run: npm ci && npm run verify:toolchain && npm run audit:install-scripts

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Prepare Electron and native modules
        run: npm run bootstrap:native

      - name: Verify release tag
        run: npm run verify:release-tag

      - name: Run quality gates
        run: npm run check

      - name: Run real PTY integration test
        run: npm run test:run
        env:
          LGT_NATIVE_TESTS: '1'

      - name: Build hardened distributable artifacts
        run: npm run make

      - name: Verify packaged native assets
        run: npm run verify:native-assets

      - name: Verify final Electron Fuses
        run: npm run verify:fuses

      - name: Upload distributables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows-x64
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Create draft release
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download all distributables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets

      - name: Normalize asset names and create checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path upload-assets | Out-Null
          Get-ChildItem -Path release-assets -File -Recurse | Sort-Object FullName | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path upload-assets "windows-x64-$($_.Name)")
          }
          $checksums = Get-ChildItem -Path upload-assets -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content -LiteralPath upload-assets/SHA256SUMS.txt -Value $checksums -Encoding ascii

      - name: Create GitHub draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Path upload-assets -File | Sort-Object Name | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files `
            --repo $env:GITHUB_REPOSITORY `
            --draft `
            --verify-tag `
            --title "Liquid Glass Terminal $env:GITHUB_REF_NAME" `
            --notes "Unsigned Windows x64 preview artifacts. Review SHA256SUMS.txt and the native QA status before publishing."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
